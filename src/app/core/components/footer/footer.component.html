<footer class="fixed bottom-0 left-0 right-0 border-t border-gray-100 bg-white/95 backdrop-blur-sm">
  <div class="mx-auto flex max-w-lg items-center justify-around px-6 py-2">
    <a
      routerLink="/"
      routerLinkActive="text-primary-600"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 text-muted transition hover:text-primary-600"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        />
      </svg>
      <span class="text-[10px] font-medium">Home</span>
    </a>
    <a
      routerLink="/planner"
      routerLinkActive="text-primary-600"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 text-muted transition hover:text-primary-600"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
        />
      </svg>
      <span class="text-[10px] font-medium">Planner</span>
    </a>
    <a
      routerLink="/attendance"
      routerLinkActive="text-primary-600"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 text-muted transition hover:text-primary-600"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
      <span class="text-[10px] font-medium">Attendance</span>
    </a>
    <a
      routerLink="/allactivity"
      routerLinkActive="text-primary-600"
      class="flex flex-col items-center gap-0.5 px-3 py-1.5 text-muted transition hover:text-primary-600"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l3-8 4 16 3-8h4" />
      </svg>
      <span class="text-[10px] font-medium">Activity</span>
    </a>
  </div>
</footer>
